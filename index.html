<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub de Estudos</title>
  <meta name="description" content="Estude um pouco todo dia: leitura com testes rápidos, simulados corrigidos, caderno de erros e flashcards com repetição espaçada.">
  <link rel="stylesheet" href="vendor/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      const tema = localStorage.getItem('hub-estudos:tema');
      if (tema) {
        document.documentElement.dataset.theme = tema;
      }
    } catch (erro) {}
  </script>
</head>
<body>
  <a class="pular" href="#app">Pular para o conteúdo</a>
  <header class="topo">
    <a class="marca" href="#/"><span class="marca-icone" aria-hidden="true">H</span><span class="marca-texto">Hub de Estudos</span></a>
    <nav aria-label="Principal">
      <a href="#/" data-nav="inicio">Início</a>
      <a href="#/revisar" data-nav="revisar">Revisar <span class="selo-nav" id="selo-revisar" hidden></span></a>
      <a href="#/progresso" data-nav="progresso">Progresso</a>
      <button class="tema" id="tema" type="button" aria-label="Alternar tema claro e escuro">◐</button>
    </nav>
  </header>
  <main id="app" tabindex="-1"><p class="aviso">Carregando…</p></main>
  <footer class="rodape">O progresso fica salvo neste navegador. Baixe um backup em Meu progresso.</footer>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
